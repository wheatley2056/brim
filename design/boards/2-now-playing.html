<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: 'Geist', 'Segoe UI Variable', sans-serif; color: #F2F3F5; background: #1A1F2B">

  <!-- Hintergrundbild (Platzhalter-Landschaft aus Formen) -->
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(1100px 700px at 18% 92%, #2E3F5C 0%, rgba(46,63,92,0) 70%), radial-gradient(900px 600px at 86% 18%, #4A3656 0%, rgba(74,54,86,0) 70%), radial-gradient(800px 500px at 64% 108%, #6B4636 0%, rgba(107,70,54,0) 70%), #171B25"></div>

  <!-- Die erweiterte Notch -->
  <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 644px; height: 248px">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 12px; height: 12px; background: radial-gradient(circle at 0 100%, transparent 11.5px, #000000 12px)"></div>
    <div aria-hidden="true" style="position: absolute; right: 0; top: 0; width: 12px; height: 12px; background: radial-gradient(circle at 100% 100%, transparent 11.5px, #000000 12px)"></div>

    <div style="position: absolute; left: 12px; top: 0; width: 620px; height: 248px; background: #000000; border-radius: 0 0 38px 38px; box-sizing: border-box; padding: 14px 24px 18px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

      <!-- Kopfzeile: Tabs und Status -->
      <div style="display: flex; align-items: center; justify-content: space-between">
        <nav aria-label="Brim sections" style="display: flex; gap: 2px; background: #121316; border-radius: 999px; padding: 3px">
          <button style="border: 0; background: #2A2B30; color: #F2F3F5; font: 500 12px 'Geist', sans-serif; padding: 6px 14px; border-radius: 999px; cursor: pointer">Now</button>
