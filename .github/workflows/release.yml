# Release bei einem Tag v<Version>: testen, veröffentlichen, mit Velopack packen, als GitHub-Release
# hochladen. Installierte Brims finden das Update von selbst und spielen es unbemerkt ein.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Leer, wenn das Secret fehlt; dann wird nicht bei winget eingereicht.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version aus dem Tag
        id: version
        shell: pwsh
        run: echo "value=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      # Sofort abbrechen, wenn der Tag auf einem Stand ohne diese Version liegt (z. B. vor dem Merge gesetzt).
      - name: Changelog-Abschnitt vorhanden
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($version))\s*$" -Quiet)) {
            throw "CHANGELOG.md hat keinen Abschnitt '## $version'. Zeigt der Tag v$version auf main, bevor der Pull Request gemergt war? Tag löschen und nach dem Merge neu setzen."
          }

      - name: Tests (ohne Netz)
        run: dotnet test Brim.slnx -c Release

      - name: Velopack-Werkzeug
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Bauen, packen, hochladen
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/release.ps1 -Version ${{ steps.version.outputs.value }} -Upload

      - name: winget-Manifeste ans Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.version.outputs.value }}" "artifacts/releases/winget-manifests-${{ steps.version.outputs.value }}.zip" --clobber

      # Nur, wenn das Secret WINGET_TOKEN gesetzt ist (siehe build/winget/README.md); das erste Mal geht von Hand.
      - name: Bei winget einreichen
        if: ${{ env.WINGET_TOKEN != '' }}
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN "artifacts/releases/winget/manifests/w/wheatley2056/Brim/${{ steps.version.outputs.value }}"
